<!-- FIREBASE FIRESTORE & CLOUD MESSAGING REAL-TIME SYNC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, arrayUnion } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getMessaging, getToken, onMessage } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-messaging.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC4zVbZZi901BPs_H86zGJcWo1dPjuvQeI",
            authDomain: "the-fridge-gd.firebaseapp.com",
            projectId: "the-fridge-gd",
            storageBucket: "the-fridge-gd.firebasestorage.app",
            messagingSenderId: "811655614078",
            appId: "1:811655614078:web:46e6ee29e2a05141a0522f",
            measurementId: "G-7QYHRNR2BK"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const messaging = getMessaging(app);
        const familyDocRef = doc(db, "hogar", "datos_compartidos");

        // PEGA AQUÍ TU CLAVE VAPID COPIADA EN EL PASO 1
        const VAPID_KEY = "TU_CLAVE_VAPID_DE_FIREBASE";

        window.STATE = {
            shoppingItems: [],
            expiringItems: [],
            tuppers: [],
            deviceTokens: [],
            familyMembers: [
                { id: 'f1', name: 'Papá', weeklyAttendance: { lun: { comida: true, cena: true }, mar: { comida: true, cena: true }, mie: { comida: true, cena: true }, jue: { comida: true, cena: true }, vie: { comida: true, cena: true }, sab: { comida: true, cena: true }, dom: { comida: true, cena: true } } },
                { id: 'f2', name: 'Mamá', weeklyAttendance: { lun: { comida: true, cena: true }, mar: { comida: true, cena: true }, mie: { comida: true, cena: true }, jue: { comida: true, cena: true }, vie: { comida: true, cena: true }, sab: { comida: true, cena: true }, dom: { comida: true, cena: true } } }
            ],
            planner: {
                lun: { comida: '', cena: '' },
                mar: { comida: '', cena: '' },
                mie: { comida: '', cena: '' },
                jue: { comida: '', cena: '' },
                vie: { comida: '', cena: '' }
            }
        };

        let isInitialLoad = true;
        let lastUpdatedTimestamp = 0;

        window.persistData = async function(notificationMessage = null) {
            try {
                window.STATE.lastUpdated = Date.now();
                if (notificationMessage) {
                    window.STATE.lastAlert = { text: notificationMessage, time: Date.now() };
                }
                await setDoc(familyDocRef, window.STATE);
            } catch (error) {
                console.error("Error al sincronizar con Firebase:", error);
            }
        };

        // Escucha en tiempo real de Firebase
        onSnapshot(familyDocRef, (docSnap) => {
            if (docSnap.exists()) {
                const cloudData = docSnap.data();
                
                // Si entra un aviso nuevo emitido por otro miembro familiar
                if (!isInitialLoad && cloudData.lastAlert && cloudData.lastAlert.time > lastUpdatedTimestamp) {
                    lastUpdatedTimestamp = cloudData.lastAlert.time;
                    triggerLocalPush("The Fridge", cloudData.lastAlert.text);
                }

                window.STATE = { ...window.STATE, ...cloudData };
                if (cloudData.lastAlert) lastUpdatedTimestamp = cloudData.lastAlert.time;
                isInitialLoad = false;
                renderAll();
            } else {
                window.persistData();
            }
        });

        function renderAll() {
            renderShoppingList();
            renderExpiringList();
            renderTuppers();
            renderFamily();
            loadPlanner();
        }

        // Registro de notificaciones Push con Service Worker
        window.requestNotificationPermission = async function(silent = false) {
            if (!('Notification' in window) || !('serviceWorker' in navigator)) {
                if (!silent) showToast("Aviso", "Añade primero la app a la pantalla de inicio para activar avisos.");
                return;
            }

            try {
                const permission = await Notification.requestPermission();
                const dot = document.getElementById('bell-dot');
                const bellBtn = document.getElementById('notification-bell');

                if (permission === 'granted') {
                    if (dot) dot.classList.remove('hidden');
                    if (bellBtn) {
                        bellBtn.classList.add('bg-brand/20', 'border-brand', 'text-brand');
                        bellBtn.classList.remove('bg-slate-800', 'border-slate-700', 'text-brand-light');
                    }

                    const registration = await navigator.serviceWorker.register('./firebase-messaging-sw.js');
                    const currentToken = await getToken(messaging, {
                        vapidKey: VAPID_KEY,
                        serviceWorkerRegistration: registration
                    });

                    if (currentToken) {
                        await setDoc(familyDocRef, {
                            deviceTokens: arrayUnion(currentToken)
                        }, { merge: true });
                    }

                    if (!silent) showToast("🔔 Activadas", "Este teléfono recibirá los avisos familiares.");
                } else {
                    if (dot) dot.classList.add('hidden');
                    if (!silent) showToast("Aviso", "Permiso de notificaciones denegado.");
                }
            } catch (err) {
                console.error("Error al registrar notificaciones:", err);
            }
        };

        function triggerLocalPush(title, body) {
            showToast(title, body);
            if (Notification.permission === 'granted' && 'serviceWorker' in navigator) {
                navigator.serviceWorker.ready.then((reg) => {
                    reg.showNotification(title, {
                        body: body,
                        icon: 'logo.png',
                        badge: 'logo.png',
                        vibrate: [200, 100, 200]
                    });
                });
            }
        }

        window.switchTab = function(tabId) {
            const tabs = ['shopping', 'alerts', 'tuppers', 'attendance', 'planner'];
            tabs.forEach(id => {
                const sec = document.getElementById(`sec-${id}`);
                const btn = document.getElementById(`nav-${id}`);
                if (sec) sec.classList.add('hidden');
                if (btn) {
                    btn.classList.remove('text-white', 'bg-brand-dark');
                    btn.classList.add('text-slate-400');
                }
            });

            const activeSec = document.getElementById(`sec-${tabId}`);
            const activeNav = document.getElementById(`nav-${tabId}`);
            if (activeSec) activeSec.classList.remove('hidden');
            if (activeNav) {
                activeNav.classList.remove('text-slate-400');
                activeNav.classList.add('text-white', 'bg-brand-dark');
            }
        };

        window.escapeHtml = function(s) {
            return (s || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        };

        let toastTimeout;
        window.showToast = function(title, message) {
            const toast = document.getElementById('toast');
            const tTitle = document.getElementById('toast-title');
            const tMsg = document.getElementById('toast-message');

            if (tTitle) tTitle.textContent = title;
            if (tMsg) tMsg.textContent = message;

            if (toast) {
                toast.classList.remove('translate-y-[-150%]', 'opacity-0', 'pointer-events-none');
                toast.classList.add('translate-y-0', 'opacity-100');
            }

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                window.hideToast();
            }, 3500);
        };

        window.hideToast = function() {
            const toast = document.getElementById('toast');
            if (toast) {
                toast.classList.add('translate-y-[-150%]', 'opacity-0', 'pointer-events-none');
                toast.classList.remove('translate-y-0', 'opacity-100');
            }
        };

        // --- COMPRA ---
        window.renderShoppingList = function() {
            const container = document.getElementById('shopping-list-container');
            if (!container) return;
            container.innerHTML = '';
            if (!window.STATE.shoppingItems || window.STATE.shoppingItems.length === 0) {
                container.innerHTML = `<div class="text-center py-6 bg-white rounded-xl border border-slate-200 text-xs text-slate-400">Sin compras pendientes.</div>`;
                return;
            }
            window.STATE.shoppingItems.forEach(item => {
                const card = document.createElement('div');
                card.id = `shop-item-${item.id}`;
                card.className = "flex items-center justify-between p-4 bg-white rounded-xl border border-slate-200 shadow-sm transition-all";
                card.innerHTML = `
                    <div class="flex items-center space-x-3.5 flex-1 cursor-pointer mr-2" onclick="toggleItemCompleted('${item.id}')">
                        <div class="w-6 h-6 rounded-lg border-2 border-slate-300 bg-slate-50 flex items-center justify-center flex-shrink-0"></div>
                        <div>
                            <span class="text-xs font-semibold text-black">${escapeHtml(item.name)}</span>
                            ${item.note ? `<p class="text-[10px] text-slate-500 mt-0.5">${escapeHtml(item.note)}</p>` : ''}
                        </div>
                    </div>
                    <button onclick="deleteShoppingItem('${item.id}')" class="text-slate-300 hover:text-slate-600 p-1">✕</button>
                `;
                container.appendChild(card);
            });
        };

        window.toggleItemCompleted = function(id) {
            const card = document.getElementById(`shop-item-${id}`);
            if (card) card.classList.add('opacity-40', 'scale-95');
            setTimeout(() => window.deleteShoppingItem(id), 300);
        };

        window.addManualProduct = function() {
            const nameInput = document.getElementById('new-product-name');
            const noteInput = document.getElementById('new-product-note');
            const name = nameInput ? nameInput.value.trim() : '';
            if (!name) return;
            if (!window.STATE.shoppingItems) window.STATE.shoppingItems = [];
            window.STATE.shoppingItems.push({ id: Date.now().toString(), name, note: noteInput?.value.trim() || null, completed: false, alertId: null });
            window.persistData(`🛒 Añadido a la compra: "${name}"`);
            if (nameInput) nameInput.value = '';
            if (noteInput) noteInput.value = '';
        };

        window.deleteShoppingItem = function(id) {
            window.STATE.shoppingItems = (window.STATE.shoppingItems || []).filter(i => i.id !== id);
            window.persistData();
        };

        // --- TUPPERS ---
        window.renderTuppers = function() {
            const container = document.getElementById('tuppers-weeks-container');
            if (!container) return;
            container.innerHTML = '';
            let unpaid = 0, paid = 0;

            (window.STATE.tuppers || []).forEach(t => {
                const total = (t.qty || 1) * (t.price || 0);
                if (t.collected) paid += total; else unpaid += total;

                const row = document.createElement('div');
                row.className = `flex items-center justify-between p-3 rounded-lg border text-xs bg-white border-slate-200 ${t.collected ? 'opacity-60' : ''}`;
                row.innerHTML = `
                    <div>
                        <p class="font-bold uppercase ${t.collected ? 'line-through text-slate-400' : 'text-slate-900'}">${escapeHtml(t.name)}</p>
                        <p class="text-[10px] text-slate-500">${t.qty} uds x ${Number(t.price).toFixed(2)}€ = ${(t.qty * t.price).toFixed(2)}€ ${t.date ? `• 📅 ${t.date}` : ''}</p>
                    </div>
                    <div class="flex items-center space-x-2">
                        <button onclick="toggleTupper('${t.id}')" class="px-2.5 py-1.5 rounded-lg text-[10px] font-bold ${t.collected ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-600'}">
                            ${t.collected ? '💵 Cobrado' : '⏳ Pendiente'}
                        </button>
                        <button onclick="deleteTupper('${t.id}')" class="text-slate-300 hover:text-red-500 p-1">✕</button>
                    </div>
                `;
                container.appendChild(row);
            });

            document.getElementById('total-unpaid-tuppers').textContent = `${unpaid.toFixed(2)} €`;
            document.getElementById('total-paid-tuppers').textContent = `${paid.toFixed(2)} €`;
        };

        window.addTupper = function() {
            const nameInput = document.getElementById('tupper-name');
            const qtyInput = document.getElementById('tupper-quantity');
            const priceInput = document.getElementById('tupper-price');
            const name = nameInput ? nameInput.value.trim() : '';
            if (!name) return;

            const dateStr = new Date().toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' });
            if (!window.STATE.tuppers) window.STATE.tuppers = [];
            window.STATE.tuppers.push({ id: 'tup_' + Date.now(), name, qty: parseInt(qtyInput?.value) || 1, price: parseFloat(priceInput?.value) || 0, date: dateStr, collected: false });
            window.persistData(`🍲 Nuevos tuppers: ${name}`);

            if (nameInput) nameInput.value = '';
            if (qtyInput) qtyInput.value = '1';
            if (priceInput) priceInput.value = '4.00';
        };

        window.toggleTupper = function(id) {
            const t = (window.STATE.tuppers || []).find(x => x.id === id);
            if (t) { t.collected = !t.collected; window.persistData(); }
        };

        window.deleteTupper = function(id) {
            window.STATE.tuppers = (window.STATE.tuppers || []).filter(x => x.id !== id);
            window.persistData();
        };

        // --- CONSUMIR PRONTO ---
        window.renderExpiringList = function() {
            const container = document.getElementById('expiring-list-container');
            if (!container) return;
            container.innerHTML = '';
            const list = window.STATE.expiringItems || [];
            if (list.length === 0) {
                container.innerHTML = `<div class="text-center py-6 bg-white rounded-xl border border-slate-200 text-xs text-slate-400">No hay comida en riesgo.</div>`;
                return;
            }

            list.forEach(item => {
                const el = document.createElement('div');
                let badgeClass = 'border-accent/40 bg-accent/5 text-accent-dark font-semibold';
                if (item.urgency === 'medium') badgeClass = 'border-amber-200 bg-amber-50/50 text-amber-800';
                if (item.urgency === 'low') badgeClass = 'border-brand-light/40 bg-brand/5 text-brand-dark';

                el.className = `p-3.5 rounded-xl border flex justify-between items-center text-xs cursor-pointer ${badgeClass}`;
                el.onclick = () => window.consumeExpiringItem(item.id);
                el.innerHTML = `<div><span class="font-bold uppercase tracking-wider text-slate-900">${escapeHtml(item.name)}</span><p class="text-[10px] text-slate-500 mt-0.5">${item.note}</p></div><span class="text-sm">🍴</span>`;
                container.appendChild(el);
            });
        };

        window.addExpiringProduct = function() {
            const input = document.getElementById('exp-product-name');
            const urgency = document.querySelector('input[name="exp-urgency"]:checked')?.value || 'high';
            const name = input ? input.value.trim() : '';
            if (!name) return;

            let note = urgency === 'high' ? 'Hoy' : (urgency === 'medium' ? 'Mañana' : 'Esta semana');
            if (!window.STATE.expiringItems) window.STATE.expiringItems = [];
            window.STATE.expiringItems.push({ id: 'exp_' + Date.now(), name, note, urgency });
            window.persistData(`⚠️ Consumir pronto: ${name}`);
            if (input) input.value = '';
        };

        window.consumeExpiringItem = function(id) {
            window.STATE.expiringItems = (window.STATE.expiringItems || []).filter(x => x.id !== id);
            window.persistData();
        };

        // --- ASISTENCIA ---
        window.renderFamily = function() {
            const container = document.getElementById('family-list-container');
            if (!container) return;
            container.innerHTML = '';
            const days = [{ k: 'lun', l: 'Lun' }, { k: 'mar', l: 'Mar' }, { k: 'mie', l: 'Mié' }, { k: 'jue', l: 'Jue' }, { k: 'vie', l: 'Vie' }, { k: 'sab', l: 'Sáb' }, { k: 'dom', l: 'Dom' }];

            (window.STATE.familyMembers || []).forEach(m => {
                const card = document.createElement('div');
                card.className = "p-3.5 bg-white rounded-xl border border-slate-200 shadow-sm space-y-2.5";
                
                let daysHtml = days.map(d => {
                    let dayObj = m.weeklyAttendance ? m.weeklyAttendance[d.k] : null;
                    let comidaIn = true, cenaIn = true;
                    if (typeof dayObj === 'boolean') { comidaIn = dayObj; cenaIn = dayObj; }
                    else if (typeof dayObj === 'object' && dayObj !== null) { comidaIn = dayObj.comida !== false; cenaIn = dayObj.cena !== false; }

                    return `
                        <div class="flex flex-col items-center bg-slate-50 border border-slate-200 rounded-lg p-1 space-y-1">
                            <span class="text-[9px] font-bold uppercase text-slate-700 leading-none">${d.l}</span>
                            <button onclick="toggleWeeklyDayMeal('${m.id}', '${d.k}', 'comida')" class="w-full py-1 rounded text-center transition-all flex items-center justify-center space-x-0.5 ${comidaIn ? 'bg-brand text-white font-bold' : 'bg-slate-200 text-slate-400 line-through'}">
                                <span class="text-[8px]">☀️</span>
                                <span class="text-[8px] font-bold">${comidaIn ? '🏠' : '❌'}</span>
                            </button>
                            <button onclick="toggleWeeklyDayMeal('${m.id}', '${d.k}', 'cena')" class="w-full py-1 rounded text-center transition-all flex items-center justify-center space-x-0.5 ${cenaIn ? 'bg-slate-900 text-white font-bold' : 'bg-slate-200 text-slate-400 line-through'}">
                                <span class="text-[8px]">🌙</span>
                                <span class="text-[8px] font-bold">${cenaIn ? '🏠' : '❌'}</span>
                            </button>
                        </div>
                    `;
                }).join('');

                card.innerHTML = `
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-bold uppercase text-slate-900 tracking-wider">${escapeHtml(m.name)}</span>
                        <button onclick="deleteFamilyMember('${m.id}')" class="text-slate-300 hover:text-slate-600 p-1">✕</button>
                    </div>
                    <div class="grid grid-cols-7 gap-1">${daysHtml}</div>
                `;
                container.appendChild(card);
            });
        };

        window.addFamilyMember = function() {
            const input = document.getElementById('new-member-name');
            const name = input ? input.value.trim() : '';
            if (!name) return;
            if (!window.STATE.familyMembers) window.STATE.familyMembers = [];
            window.STATE.familyMembers.push({
                id: 'fam_' + Date.now(),
                name,
                weeklyAttendance: { lun: { comida: true, cena: true }, mar: { comida: true, cena: true }, mie: { comida: true, cena: true }, jue: { comida: true, cena: true }, vie: { comida: true, cena: true }, sab: { comida: true, cena: true }, dom: { comida: true, cena: true } }
            });
            window.persistData();
            if (input) input.value = '';
        };

        window.toggleWeeklyDayMeal = function(id, dayKey, mealType) {
            const m = (window.STATE.familyMembers || []).find(f => f.id === id);
            if (m) {
                if (!m.weeklyAttendance) m.weeklyAttendance = {};
                let dayObj = m.weeklyAttendance[dayKey];
                if (typeof dayObj !== 'object' || dayObj === null) {
                    let defaultVal = typeof dayObj === 'boolean' ? dayObj : true;
                    dayObj = { comida: defaultVal, cena: defaultVal };
                }
                dayObj[mealType] = !dayObj[mealType];
                m.weeklyAttendance[dayKey] = dayObj;
                window.persistData();
            }
        };

        window.deleteFamilyMember = function(id) {
            window.STATE.familyMembers = (window.STATE.familyMembers || []).filter(f => f.id !== id);
            window.persistData();
        };

        window.resetAttendanceWeek = function() {
            (window.STATE.familyMembers || []).forEach(m => {
                m.weeklyAttendance = { lun: { comida: true, cena: true }, mar: { comida: true, cena: true }, mie: { comida: true, cena: true }, jue: { comida: true, cena: true }, vie: { comida: true, cena: true }, sab: { comida: true, cena: true }, dom: { comida: true, cena: true } };
            });
            window.persistData();
        };

        // --- MENÚS ---
        window.loadPlanner = function() {
            const days = ['lun', 'mar', 'mie', 'jue', 'vie'];
            days.forEach(d => {
                const elComida = document.getElementById(`plan-${d}-comida`);
                const elCena = document.getElementById(`plan-${d}-cena`);
                const dayData = window.STATE.planner ? window.STATE.planner[d] : null;

                if (elComida && document.activeElement !== elComida) {
                    elComida.value = (typeof dayData === 'object' && dayData !== null) ? (dayData.comida || '') : (typeof dayData === 'string' ? dayData : '');
                }
                if (elCena && document.activeElement !== elCena) {
                    elCena.value = (typeof dayData === 'object' && dayData !== null) ? (dayData.cena || '') : '';
                }
            });
        };

        let debounceTimer;
        window.savePlanner = function(day, mealType, text) {
            if (!window.STATE.planner) window.STATE.planner = {};
            if (typeof window.STATE.planner[day] !== 'object' || window.STATE.planner[day] === null) {
                window.STATE.planner[day] = { comida: '', cena: '' };
            }
            window.STATE.planner[day][mealType] = text;
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                window.persistData(`📅 Menú actualizado: ${day.toUpperCase()}`);
            }, 600);
        };
    </script>
</body>
</html>
